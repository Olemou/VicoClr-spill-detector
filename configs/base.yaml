# configs/config.yaml

training:
  base_batch_size: 32
  
  # Learning Rates
  base_lr_backbone: 7.0e-5
  base_lr_head:     9.5e-5
  
  # Weight Decay
  weight_decay_backbone: 0.1
  weight_decay_head:     0.05

  # Optimizer settings
  optimizer:
    name: AdamW
    betas: [0.9, 0.999]
    eps: 1e-8
